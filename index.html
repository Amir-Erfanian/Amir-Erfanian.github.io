<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amir Erfanian — Computer Engineering Student</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, #58a6ff, #bc8cff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: #0d1117;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.25rem;
        }

        .tagline {
            color: #8b949e;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .bio {
            margin-bottom: 1.5rem;
            color: #c9d1d9;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #8b949e;
            margin-bottom: 0.75rem;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .tag {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 0.25rem 0.75rem;
            font-size: 0.85rem;
            color: #58a6ff;
        }

        .links {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .links a {
            text-decoration: none;
            color: #e6edf3;
            background: #21262d;
            border: 1px solid #30363d;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .links a:hover {
            background: #30363d;
            border-color: #58a6ff;
            transform: translateY(-2px);
        }

        .links a.primary {
            background: #238636;
            border-color: #2ea043;
        }

        .links a.primary:hover {
            background: #2ea043;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="avatar">AE</div>

        <h1>Amir Erfanian</h1>
        <p class="tagline">Computer Engineering Student · Tech
            Enthusiast</p>

        <p class="bio">
            I'm a computer engineering student who loves building things on
            the web.
            Here I share my projects and things I'm learning along the way.
        </p>

        <p class="section-title">Currently Learning</p>
        <div class="tags">
            <span class="tag">Python</span>
            <span class="tag">Django</span>
            <span class="tag">Web Design</span>
        </div>

        <p class="section-title">Find Me</p>
        <div class="links">
            <a href="https://github.com/Amir-Erfanian" target="_blank" class="primary">GitHub</a>
            <a href="https://www.linkedin.com/in/amir-erfanian-452078422/" target="_blank">LinkedIn</a>
        </div>
    </div>
</body>

</html>
